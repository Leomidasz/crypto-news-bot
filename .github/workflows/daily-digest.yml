# สรุปข่าวคริปโตอัตโนมัติทุกเช้า → อัปเดตเว็บแอป + แจ้งเตือน Telegram
#
# 🔒 มาตรการความปลอดภัย (repo เป็น Public):
#   1. รันได้แค่ 2 ทาง: ตามเวลา และปุ่ม Run workflow (เฉพาะเจ้าของกดได้)
#      ไม่รับ pull_request/issue จากคนนอก → คนนอกส่งโค้ดมารันกับกุญแจไม่ได้
#   2. actions ทุกตัวล็อกด้วยรหัส commit (SHA) ไม่ใช่ชื่อ tag → เจ้าของ action แอบเปลี่ยนโค้ดไม่ได้
#   3. ไลบรารี Python ล็อกเวอร์ชัน + ลายนิ้วมือ (hash) → ถ้ามีเวอร์ชันปลอมโผล่มา ติดตั้งไม่ผ่าน
#   4. กุญแจส่งให้เฉพาะขั้นที่ต้องใช้ ขั้นติดตั้งไลบรารีไม่เห็นกุญแจ
#   5. สิทธิ์ push ของ GitHub ไม่ถูกเก็บไว้ในเครื่องระหว่างรัน (persist-credentials: false)
name: Daily crypto digest

on:
  schedule:
    # 23:40 UTC = 06:40 เวลาไทย (GitHub อาจดีเลย์ 5-30 นาที บางวันมากกว่า)
    - cron: "40 23 * * *"
  workflow_dispatch:        # ปุ่ม "Run workflow" สำหรับกดรันเองได้ทุกเมื่อ (เฉพาะเจ้าของ repo)
    inputs:
      hours:
        description: "สรุปย้อนหลังกี่ชั่วโมง (1-168)"
        default: "24"

permissions:
  contents: write           # ให้ commit ไฟล์สรุปใหม่เข้า repo ได้ (อย่างเดียว)

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (เช็กลายนิ้วมือทุกไฟล์)
        run: pip install --require-hashes --no-deps -r requirements.lock

      # ความจำโพสต์/ID บัญชีที่เคยดึงแล้ว → ไม่เสียค่า X API ซ้ำ
      - name: Restore cache database
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25   # v5
        with:
          path: newsbot.db
          key: newsbot-db-${{ github.run_id }}
          restore-keys: newsbot-db-

      - name: Fetch + summarize + save
        env:
          # --- กุญแจลับ: Settings → Secrets and variables → Actions → Secrets ---
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          # --- ค่าทั่วไป (แก้ง่าย): Settings → Secrets and variables → Actions → Variables ---
          X_ACCOUNTS: ${{ vars.X_ACCOUNTS }}
          DISCORD_CHANNEL_IDS: ${{ vars.DISCORD_CHANNEL_IDS }}
          APP_URL: ${{ vars.APP_URL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          X_MAX_POSTS_PER_ACCOUNT: ${{ vars.X_MAX_POSTS_PER_ACCOUNT }}
          HOURS_INPUT: ${{ github.event.inputs.hours }}
        run: |
          # รับเฉพาะตัวเลข 1-168 (กันค่าแปลกๆ ถูกส่งเข้าคำสั่ง)
          HOURS="${HOURS_INPUT:-24}"
          case "$HOURS" in ''|*[!0-9]*) HOURS=24 ;; esac
          if [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 168 ]; then HOURS=24; fi
          python publish.py "$HOURS"

      - name: Commit new digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
            exit 0
          fi
          git commit -m "สรุปข่าว $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTE" "${GITHUB_REF_NAME}"
          git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"
